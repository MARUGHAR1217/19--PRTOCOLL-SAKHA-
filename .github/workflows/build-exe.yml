
name: Build PROTOCOL SAKHA EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare web files and matching icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path www/assets, build | Out-Null

          Copy-Item index.html www/index.html -Force
          Copy-Item native-shim.js www/native-shim.js -Force
          Copy-Item NotoSansGujarati-Regular.ttf www/assets/ -Force
          Copy-Item NotoSansGujarati-Bold.ttf www/assets/ -Force

          Copy-Item icon.png build/icon.png -Force

          (Get-Content www/index.html -Raw).Replace('../assets/NotoSansGujarati-', 'assets/NotoSansGujarati-') | Set-Content www/index.html -NoNewline

          if (-not (Test-Path build/icon.png)) {
            throw "App icon was not prepared."
          }

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        run: npx electron-builder --win portable --x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Publish EXE
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-exe
          path: dist/PROTOCOL-SAKHA.exe
          if-no-files-found: error
