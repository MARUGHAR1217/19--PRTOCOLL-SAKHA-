
name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web files
        run: |
          mkdir -p www/assets www/lib
          cp index.html www/index.html
          cp native-shim.js www/native-shim.js
          cp NotoSansGujarati-Regular.ttf www/assets/
          cp NotoSansGujarati-Bold.ttf www/assets/
          sed -i 's#../assets/NotoSansGujarati-#assets/NotoSansGujarati-#g' www/index.html

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          npm install html2canvas@1.4.1 jspdf@2.5.1 esbuild

      - name: Prepare native plugins
        run: |
          npx esbuild native-plugins-entry.js --bundle --platform=browser --format=iife --outfile=www/lib/native-plugins.js
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/
          if ! grep -q 'lib/native-plugins.js' www/index.html; then
            sed -i 's#</head>#<script src="capacitor.js"></script><script src="lib/native-plugins.js"></script><script src="native-shim.js"></script></head>#' www/index.html
          fi

      - name: Configure Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
