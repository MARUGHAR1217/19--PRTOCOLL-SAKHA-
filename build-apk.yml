
name: Build PROTOCOL SAKHA APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare project files
        run: |
          mkdir -p cap/www/assets cap/www/lib cap/assets
          cp index.html cap/www/index.html
          cp native-shim.js cap/www/native-shim.js
          cp native-plugins-entry.js cap/
          cp capacitor.config.json cap/
          cp NotoSansGujarati-Regular.ttf cap/www/assets/
          cp NotoSansGujarati-Bold.ttf cap/www/assets/
          cp icon.png cap/assets/icon.png
          cp icon-foreground.png cap/assets/icon-foreground.png
          cp icon-background.png cap/assets/icon-background.png
          cp icon-only.png cap/assets/icon-only.png
          sed -i 's#../assets/NotoSansGujarati-#assets/NotoSansGujarati-#g' cap/www/index.html

      - name: Install Capacitor
        working-directory: cap
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm install @capacitor/filesystem@6 @capacitor/share@6 @capacitor/app@6
          npm install html2canvas@1.4.1 jspdf@2.5.1 esbuild
          npm install --save-dev @capacitor/assets@3

      - name: Prepare web plugins and icons
        working-directory: cap
        run: |
          npx esbuild native-plugins-entry.js --bundle --platform=browser --format=iife --outfile=www/lib/native-plugins.js
          cp node_modules/html2canvas/dist/html2canvas.min.js www/lib/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/lib/
          grep -q 'lib/native-plugins.js' www/index.html || sed -i 's#</head>#<script src="capacitor.js"></script><script src="lib/native-plugins.js"></script><script src="native-shim.js"></script></head>#' www/index.html
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Build Debug APK
        working-directory: cap/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROTOCOL-SAKHA-apk
          path: cap/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
